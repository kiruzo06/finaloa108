<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identification Quiz: Entrepreneurship</title>
    <style>
        :root {
            --primary: #1e293b;
            --accent: #3b82f6;
            --success: #15803d;
            --danger: #b91c1c;
            --bg: #f1f5f9;
            --card: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--primary);
            padding-top: 140px;
            line-height: 1.6;
        }

        header {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: white;
            border-bottom: 3px solid var(--accent);
            padding: 15px;
            text-align: center;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .header-content { max-width: 800px; margin: 0 auto; }

        .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 10px 0;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .shuffle-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .shuffle-btn:hover { background: #2563eb; }

        .container { max-width: 700px; margin: 0 auto; padding: 20px; }

        .q-card {
            background: var(--card);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        .q-text { font-weight: 600; margin-bottom: 15px; font-size: 1.05rem; }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
        }

        input[type="text"]:focus { border-color: var(--accent); }

        .check-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .feedback {
            margin-top: 10px;
            font-weight: bold;
            padding: 8px;
            border-radius: 6px;
            display: none;
        }

        .correct-style { background: #dcfce7; color: var(--success); }
        .wrong-style { background: #fee2e2; color: var(--danger); }

        .correct-answer-hint {
            display: block;
            font-size: 0.9rem;
            margin-top: 5px;
            font-weight: normal;
        }

        @media (max-width: 500px) {
            .input-group { flex-direction: column; }
            .check-btn { padding: 12px; }
            body { padding-top: 160px; }
        }
    </style>
</head>
<body>

<header>
    <div class="header-content">
        <h2>Identification: Entrepreneurship</h2>
        <div class="stats">
            <span>Score: <span id="score">0</span> / <span id="total-count">0</span></span>
        </div>
        <button class="shuffle-btn" onclick="initQuiz()">Shuffle & Restart</button>
    </div>
</header>

<div class="container" id="quiz-container"></div>

<script>
    const questionsData = [
        // Topic 8
        { q: "The ability of an entrepreneur to recover after experiencing failure, stress, or problems.", a: ["Resilience"] },
        { q: "The ability to adjust to new situations, market trends, and competition quickly.", a: ["Adaptability"] },
        { q: "The ability to identify problems clearly and find effective solutions.", a: ["Problem-Solving Skills", "Problem Solving Skills"] },
        { q: "According to Gomez & Saint Pasahol, these entrepreneurs see failure as a chance to learn.", a: ["Growth Mindset"] },
        { q: "According to Gomez & Saint Pasahol, these entrepreneurs may stop trying after failure.", a: ["Fixed Mindset"] },
        { q: "Using mistakes as lessons for improvement instead of repeating the same errors.", a: ["Learning from Failure"] },
        
        // Topic 9
        { q: "Doing what is right, fair, and honest in business activities; avoiding cheating.", a: ["Business Ethics"] },
        { q: "When businesses help society through donations, programs, or community support.", a: ["Corporate Social Responsibility", "CSR"] },
        { q: "Protecting the environment by reducing pollution, waste, and harmful practices.", a: ["Environmental Responsibility"] },
        { q: "Giving equal respect, fair wages, and honest dealings to employees and customers.", a: ["Fair Treatment of Stakeholders"] },
        
        // Topic 10
        { q: "Research area focusing on digital tools like apps and AI to grow businesses.", a: ["Technology and Digital Entrepreneurship"] },
        { q: "Study of how entrepreneurs think, act, and make decisions.", a: ["Behavioral Studies"] },
        { q: "Research focusing on how new ideas are created and turned into products.", a: ["Innovation Research"] },
        { q: "Research looking at how entrepreneurship changes in different countries and cultures.", a: ["Global Entrepreneurship Trends"] },
        
        // Topic 11
        { q: "Noticing problems or needs in society that can be turned into business ideas.", a: ["Opportunity Recognition"] },
        { q: "Creating something new or improving existing products to meet needs better.", a: ["Innovation"] },
        { q: "The ability to understand customer needs, problems, and market trends.", a: ["Market Awareness"] },
        { q: "The ability to think of new and unique ideas.", a: ["Creativity"] },
        { q: "The step-by-step process of turning ideas into real products (planning, testing, etc).", a: ["Innovation Process"] },
        { q: "Checking if a business idea is possible, profitable, and useful before starting.", a: ["Opportunity Evaluation"] },
        
        // Topic 12
        { q: "Internal motivation that comes from personal interest, passion, and enjoyment.", a: ["Intrinsic Motivation"] },
        { q: "Motivation that comes from external rewards like money, success, and status.", a: ["Extrinsic Motivation"] },
        { q: "Strong emotional feeling and love toward business activities.", a: ["Passion"] },
        { q: "The strong desire or specific decision to start a business in the future.", a: ["Entrepreneurial Intention"] },
        
        // Topic 13
        { q: "A situation in business where the future is not clear.", a: ["Uncertainty"] },
        { q: "The possibility of loss in a business venture.", a: ["Risk"] },
        { q: "Identifying possible dangers or losses before making decisions.", a: ["Risk Assessment"] },
        { q: "Collecting data and facts before making decisions to reduce mistakes.", a: ["Information Gathering"] },
        { q: "Using experience and gut feeling to make decisions when info is incomplete.", a: ["Intuition"] },
        { q: "Carefully studying problems and comparing solutions before choosing.", a: ["Analytical Thinking"] },
        
        // Topic 14
        { q: "A society's mindset that supports creativity, risk-taking, and business creation.", a: ["Entrepreneurial Culture"] },
        { q: "The environment (gov, investors, schools) that helps entrepreneurs succeed.", a: ["Entrepreneurial Ecosystem"] },
        { q: "Includes laws, programs, and funding provided by the state to help startups.", a: ["Government Support"] },
        { q: "Investors, banks, and loans that provide money for business ideas.", a: ["Financial Support Systems"] },
        { q: "Schools, seminars, and workshops that teach business skills.", a: ["Education and Training"] },
        { q: "Connections between entrepreneurs and mentors that help share opportunities.", a: ["Business Networks"] }
    ];

    let score = 0;
    let questionsAnswered = new Set();

    function shuffle(array) {
        return array.sort(() => Math.random() - 0.5);
    }

    function initQuiz() {
        score = 0;
        questionsAnswered.clear();
        updateScore();
        
        const container = document.getElementById('quiz-container');
        container.innerHTML = "";
        
        const shuffledQuestions = shuffle([...questionsData]);
        document.getElementById('total-count').textContent = shuffledQuestions.length;

        shuffledQuestions.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'q-card';
            card.id = `card-${index}`;
            
            card.innerHTML = `
                <div class="q-text">${index + 1}. ${item.q}</div>
                <div class="input-group">
                    <input type="text" placeholder="Type answer here..." id="input-${index}" 
                        onkeypress="handleEnter(event, ${index}, '${item.a.join('|')}')">
                    <button class="check-btn" onclick="check(${index}, '${item.a.join('|')}')">Check</button>
                </div>
                <div class="feedback" id="feed-${index}"></div>
            `;
            container.appendChild(card);
        });
        window.scrollTo(0,0);
    }

    function handleEnter(e, index, answers) {
        if (e.key === "Enter") {
            check(index, answers);
        }
    }

    function check(index, answersRaw) {
        if (questionsAnswered.has(index)) return;

        const input = document.getElementById(`input-${index}`);
        const feedback = document.getElementById(`feed-${index}`);
        const userAns = input.value.trim().toLowerCase();
        const correctAnswers = answersRaw.toLowerCase().split('|');

        if (userAns === "") return;

        questionsAnswered.add(index);
        input.disabled = true;
        const checkBtn = input.nextElementSibling;
        checkBtn.disabled = true;
        checkBtn.style.opacity = "0.5";

        if (correctAnswers.includes(userAns)) {
            score++;
            updateScore();
            feedback.textContent = "✓ Correct!";
            feedback.className = "feedback correct-style";
        } else {
            feedback.innerHTML = `✗ Incorrect. <span class="correct-answer-hint">Correct Answer: <b>${answersRaw.split('|')[0]}</b></span>`;
            feedback.className = "feedback wrong-style";
        }
        feedback.style.display = "block";
    }

    function updateScore() {
        document.getElementById('score').textContent = score;
    }

    // Start
    initQuiz();
</script>

</body>
</html>
